name: phpstan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpstan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.3, 8.2]

    steps:
      - uses: actions/checkout@v7

      - name: Update SSL Certificates
        run: sudo apt-get update && sudo apt-get install --reinstall -y ca-certificates

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, gd
          coverage: none
          ini-values: curl.cainfo="/etc/ssl/certs/ca-certificates.crt", openssl.cafile="/etc/ssl/certs/ca-certificates.crt"

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress
